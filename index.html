<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta id="vp-meta" name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          if (window.self === window.top) {
            var w = window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || 0;
            var sw = (window.screen && window.screen.width) || 0;
            var sh = (window.screen && window.screen.height) || 0;
            var isNarrowPortrait = (w > 0 && w !== 980) ? w < 500 : (sw > 0 && sw < 500 && (!sh || sw <= sh));
            if (isNarrowPortrait) {
              var vp = document.getElementById('vp-meta');
              if (vp) vp.setAttribute('content', 'width=500');
            }
          }
        } catch (e) {}
      })();
    </script>
    <title>RSR</title>
    <meta name="description" content="The Main Community Hub" />
    <meta name="theme-color" content="#00f2fe" />

    <!-- OpenGraph Social Embeds (Discord, Telegram, Web) -->
    <meta property="og:title" content="RSR" />
    <meta property="og:description" content="The Main Community Hub" />
    <meta property="og:site_name" content="RSR" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn.discordapp.com/icons/1454504133716349031/5862fe097ae61ac2c28600b7d0bbeecf.png?size=256" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RSR" />
    <meta name="twitter:description" content="The Main Community Hub" />
    <meta name="twitter:image" content="https://cdn.discordapp.com/icons/1454504133716349031/5862fe097ae61ac2c28600b7d0bbeecf.png?size=256" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RSR",
        "description": "The Main Community Hub"
      }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body class="relative selection:bg-cyan-400 selection:text-black bg-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
